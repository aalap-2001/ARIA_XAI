    entity: CreditPolicy
    subject: personal-loan
    predicate: limits
    value: {max_dti: 0.50, max_amount: 75000}
    effective_from: "2022-01-01"
    published_at: "2021-12-15"
    ingested_at: "2021-12-16"
    superseded_by_key: pl-policy-2024
    invalidated_at: "2024-01-02"
    source: {source: "Credit policy CP-12 v4", locator: "§2.1", ingest_job: "policy-sync-118"}
  - key: pl-policy-2024
    entity: CreditPolicy
    subject: personal-loan
    predicate: limits
    value: {max_dti: 0.43, max_amount: 75000}
    effective_from: "2024-01-01"
