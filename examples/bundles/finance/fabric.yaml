roles:
  - agent: uma
    scope: case
    entities: [Application, Applicant, BureauReport, BankAccount, CreditPolicy, ScreeningResult, Insight]
    write: [Application]
  - agent: auditor
    scope: tenant
    entities: [Application, Applicant, BureauReport, BankAccount, CreditPolicy, ScreeningResult, Insight]
decisions: [APPROVE_LOAN, DECLINE_LOAN]
retention:
  facts_years: 7
  episodes_years: 7
  receipts_days: 2555   # fair-lending examinations reach back years
reflection:
  entity: Insight
  min_evidence: 3
seed_facts:
